<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>來去拜訪盤古大帝</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --color-bg:#EDE8DF; --color-surface:#F5F2EC; --color-surface-low:#D9D3C7;
  --color-text:#2C3A4A; --color-text-secondary:#5A6A7A; --color-text-disabled:#9AABB8;
  --color-primary:#548EB8; --color-primary-light:#97AFCA; --color-primary-subtle:#BAC2D0;
  --color-cta:#C66240; --color-success:#4A7A65; --color-success-subtle:#C5D9D2;
  --sh1:0 1px 3px rgba(44,58,74,.12),0 1px 2px rgba(44,58,74,.08);
  --sh2:0 4px 8px rgba(44,58,74,.12),0 2px 4px rgba(44,58,74,.08);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--color-bg);color:var(--color-text);font-family:'Quicksand','Noto Sans TC',sans-serif;
  display:flex;flex-direction:column;align-items:center;padding:40px 16px 24px;overflow-x:hidden}
#app{width:100%;max-width:770px}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:42px}
h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.02em}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;font-size:13px;font-weight:500;border:0;border-radius:9999px;padding:8px 16px;cursor:pointer;
  background:var(--color-surface);color:var(--color-text);box-shadow:var(--sh1);transition:background .15s,box-shadow .15s,transform .1s}
button:hover{background:var(--color-primary-subtle);box-shadow:var(--sh2)}
button:active{transform:translateY(1px)}
button.cta{background:var(--color-cta);color:#fff}
button.cta:hover{background:#B2553A}
button.pri{background:var(--color-primary);color:#fff}
button.pri:hover{background:#4C7A91}
button:disabled{opacity:.4;cursor:default;pointer-events:none}
.sep{width:1px;height:22px;background:var(--color-surface-low);margin:0 2px}
#zoomLayer{position:absolute;left:0;top:0;width:1100px;height:720px;transform-origin:0 0}
#bless{position:absolute;left:0;right:0;top:595px;text-align:center;font-size:26px;font-weight:600;letter-spacing:.08em;color:var(--color-text);opacity:0;transform:translateY(8px);transition:opacity .5s .15s,transform .5s .15s;pointer-events:none}
#bless.show{opacity:1;transform:none}
.chip{font-size:12px;font-weight:500;padding:7px 12px;border-radius:9999px;background:var(--color-primary-subtle);min-width:84px;text-align:center;transition:background .3s}
.chip.done{background:var(--color-success-subtle);color:var(--color-success)}
#stageWrap{position:relative;margin:0 auto;border-radius:16px;overflow:hidden;box-shadow:var(--sh2);background:#F1EDE4}
#world{position:absolute;left:0;top:0;width:1100px;height:720px;transform-origin:0 0;touch-action:none;user-select:none;-webkit-user-select:none}
#baseWrap{position:absolute;inset:0;perspective:1300px;perspective-origin:50% 30%;pointer-events:none;z-index:1}
#baseShadow{position:absolute;border-radius:50%;background:rgba(44,58,74,.16);filter:blur(14px)}
#base{position:absolute;transform-style:preserve-3d;transform:rotateX(56deg)}
#base .layer{position:absolute;inset:0;background:#CFC6B2;-webkit-mask-size:100% 100%;mask-size:100% 100%}
#base img{position:absolute;inset:0;width:100%;height:100%;display:block}
.slot{position:absolute;border-radius:4px;transition:box-shadow .15s,background .15s}
.slot.hot{background:rgba(198,98,64,.35);box-shadow:0 0 0 3px #F0D4C6,0 0 18px 6px rgba(198,98,64,.55)}
.slot.hint{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px #97AFCA,0 0 14px 4px rgba(84,142,184,.55)}}
.contact{position:absolute;height:16px;border-radius:50%;background:rgba(44,58,74,.38);filter:blur(5px);pointer-events:none;transition:opacity .25s;opacity:0}
.piece{position:absolute;pointer-events:none;will-change:transform;transform:rotate(var(--rot,0deg)) scale(var(--sc,1))}
.piece img{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none;
  filter:drop-shadow(0 0 1px rgba(255,255,255,.9)) drop-shadow(0 9px 12px rgba(44,58,74,.28))}
.piece.seated img{filter:drop-shadow(0 0 1px rgba(255,255,255,.9)) drop-shadow(0 2px 3px rgba(44,58,74,.22))}
.piece.dragging img{filter:drop-shadow(0 0 1px rgba(255,255,255,.9)) drop-shadow(0 20px 20px rgba(44,58,74,.30))}
.piece.bounce img{animation:bounce .35s ease-out}
@keyframes bounce{0%{transform:translateY(-10px)}60%{transform:translateY(2px)}100%{transform:none}}
#win{position:absolute;left:0;right:0;top:90px;z-index:100;text-align:center;font-size:22px;font-weight:600;color:var(--color-success);opacity:0;transform:translateY(-6px);transition:opacity .4s,transform .4s;pointer-events:none}
#win.show{opacity:1;transform:none}
footer{margin-top:42px;text-align:center;font-size:12px;color:var(--color-text-secondary)}
#modal{position:fixed;inset:0;z-index:300;background:rgba(44,58,74,.55);display:flex;align-items:center;justify-content:center;padding:16px}
#modal[hidden]{display:none}
#modal .sheet{background:var(--color-surface);border-radius:16px;padding:14px;max-width:min(96vw,760px);box-shadow:0 8px 16px rgba(44,58,74,.12),0 4px 8px rgba(44,58,74,.08);text-align:center}
#modal img{display:block;width:100%;max-height:62vh;object-fit:contain;border-radius:8px;background:#F1EDE4;-webkit-touch-callout:default}
#modal p{margin:10px 0 12px;font-size:13px;color:var(--color-text-secondary)}
#modal .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
@media (max-width:700px){
  body{padding:20px 16px 20px}
  h1{font-size:18px}
  header{margin-bottom:18px;gap:8px 10px}
  footer{margin-top:18px}
  button{font-size:12px;padding:7px 12px}
  .chip{font-size:11px;min-width:0;padding:6px 10px}
  .tools{gap:6px}
}
@media (prefers-reduced-motion:reduce){.slot.hint,.piece.bounce img{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>來去拜訪盤古大帝</h1>
    <div class="tools">
      <span class="chip" id="count">已插好 0 / 3</span>
      <button class="cta" id="btnAuto">自動組合</button>
      <button id="btnScatter">打散重來</button>
      <span class="sep"></span>
      <button id="btnZin" disabled>放大</button>
      <button id="btnZout" disabled>縮小</button>
      <button id="btnZreset" disabled>還原</button>
      <button class="pri" id="btnSave" disabled>存成圖片</button>
    </div>
  </header>
  <div id="stageWrap">
    <div id="world">
      <div id="zoomLayer"><div id="baseWrap"><div id="baseShadow"></div><div id="base"></div></div></div>
      <div id="win">\ 完成 /</div>
      <div id="bless">願你永遠可以擁有開天闢地的勇氣</div>
      
    </div>
  </div>
  <div id="modal" hidden><div class="sheet"><img id="outImg" alt="成品圖">
    <p id="outHint">手機可長按圖片儲存</p>
    <div class="row"><button class="pri" id="btnShare">下載圖片</button><button id="btnClose">關閉</button></div></div></div>
  <footer>Triple.Cell_Illustration × Lurn Creative Ltd.</footer>
</div>

const isTall = () => innerWidth < 480 || (innerWidth < 700 && matchMedia('(pointer:coarse)').matches);
const TALL = isTall();                                // phone portrait -> tall stage (a narrowed desktop window just scales down)
const S = TALL ? 0.42 : 0.3, SW = TALL ? 640 : 1100, SH = TALL ? 900 : 720, MAXK = TALL ? 1 : 0.7;
const U = S / 0.3;                                    // size factor vs. the desktop layout
const $ = s => document.querySelector(s);
const world = $('#world'), wrap = $('#stageWrap'), zl = $('#zoomLayer');
let k = MAXK;
world.style.width = zl.style.width = SW + 'px'; world.style.height = zl.style.height = SH + 'px';
$('#baseWrap').style.perspective = 1300 * U + 'px';
const ART_H = 289.4 * U, ART_CY = SH / 2;           // assembled artwork is centred in the stage
{ const top = ART_CY - ART_H / 2, bot = ART_CY + ART_H / 2, fs = TALL ? 34 : 26;
  Object.assign($('#win').style, { top: (top / 2 - 17 * U) + 'px', fontSize: (TALL ? 30 : 22) + 'px' });
  Object.assign($('#bless').style, { top: ((bot + SH) / 2 - 17 * U) + 'px', fontSize: fs + 'px' }); }

/* ---------- base + slots (holes follow the artwork's own slot boxes) ---------- */
const base = $('#base'), B = DATA.base;
const BW = B.w * S, BH = B.h * S, BX = SW / 2, BY = SH / 2 + 87.5 * U;
Object.assign(base.style, { width: BW + 'px', height: BH + 'px', left: (BX - BW / 2) + 'px', top: (BY - BH / 2) + 'px' });
[-2, -4, -5].map(v => v * U).forEach(z => {
  const l = document.createElement('div'); l.className = 'layer'; l.style.transform = `translateZ(${z}px)`;
  l.style.webkitMaskImage = l.style.maskImage = `url(${B.src})`; base.appendChild(l);
});
const bimg = new Image(); bimg.src = B.src; bimg.draggable = false; base.appendChild(bimg);
Object.assign($('#baseShadow').style, { left: (BX - BW / 2 - 6) + 'px', top: (BY - 6) + 'px', width: (BW + 12) + 'px', height: 40 * U + 'px' });

const slots = DATA.slots.map(s => {
  const el = document.createElement('div'); el.className = 'slot';
  Object.assign(el.style, { width: s.w * S + 'px', height: s.h * S + 'px', left: (s.x - s.w / 2) * S + 'px', top: (s.y - s.h / 2) * S + 'px' });
  base.appendChild(el); return { el, x: 0, y: 0 };

/* ---------- zoom / pan (after assembly) ---------- */

function seat(p, animate = true) {

/* ---------- save as PNG (re-draws the scene on a canvas, including the current zoom) ---------- */
function tri(g, img, s, d) {
  const [[x0, y0], [x1, y1], [x2, y2]] = s, [[u0, v0], [u1, v1], [u2, v2]] = d;
  const det = x0 * (y1 - y2) - y0 * (x1 - x2) + (x1 * y2 - x2 * y1); if (!det) return;
  const sol = (a0, a1, a2) => [

    (x0 * (a1 - a2) - a0 * (x1 - x2) + (x1 * a2 - x2 * a1)) / det,
    (x0 * (y1 * a2 - y2 * a1) - y0 * (x1 * a2 - x2 * a1) + a0 * (x1 * y2 - x2 * y1)) / det];

function drawMesh(g, img, q, N = 14) {     // draws img onto the perspective quad q (tl, tr, br, bl)

const OUT_W = 1980, OUT_H = 1020, BLESS = '願你永遠可以擁有開天闢地的勇氣', NAME = '盤古大帝-三插壓克力立牌.png';
let outBlob = null, outUrl = null;
